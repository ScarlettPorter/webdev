<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1 id="contact-title">Contact Groove Haven</h1>

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="services.html">Products</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main>

            <section class="manager-section">

                <h2>Customer Service Manager</h2>

                <img src="images/single-line-drawing-young-female-600nw-2738837575.webp" alt="Customer Service Manager">

                <p>
                    Meet Ava Brooks, our customer service manager who helps vinyl
                    collectors find the perfect records and equipment.
                </p>

            </section>

            <section class="form-section">

                <h2>Send Us a Message</h2>

                <form>

                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">

                    <label for="comments">Comments:</label>
                    <textarea id="comments" name="comments"></textarea>

                    <button type="submit">Submit</button>

                </form>

            </section>

        </main>

        <footer>
            <p>© 2026 Groove Haven Vinyl Co.</p>
        </footer>

    </div>

</body>

</html>
